name: Build Cl0de

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # The sherpa-onnx AAR (49 MB) is too large for the git API push path, so it is
      # fetched from the pinned official k2-fsa release and verified by sha256.
      - name: sherpa-onnx AAR
        run: |
          mkdir -p app/libs
          curl -sL -o app/libs/sherpa-onnx-2.0.1.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar
          echo "a8d09d1d32f3eb8520482c6d3d43fae674681c5b050385967c70a3c2c9bf0ee7  app/libs/sherpa-onnx-2.0.1.aar" | sha256sum -c -

      # Fixed signing key from a secret: the same key every build, so a new APK
      # installs over the previous one instead of being rejected by Android.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "SIGNING_KEYSTORE_B64 secret is missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cl0de.keystore"

      # MiMo session cookie from a secret, decoded over the placeholder asset
      # so it ships inside the APK (every install can use MiMo with no login).
      # Fail-closed like the signing key: a missing secret fails the build
      # instead of silently shipping the placeholder. The checks below only
      # ever test existence, a key NAME and a hash, never the content.
      - name: MiMo cookie
        env:
          MIMO_COOKIE_B64: ${{ secrets.MIMO_COOKIE_B64 }}
        run: |
          test -n "$MIMO_COOKIE_B64" || { echo "MIMO_COOKIE_B64 secret is missing"; exit 1; }
          echo "$MIMO_COOKIE_B64" | base64 -d > app/src/main/assets/mimocook.txt
          test -s app/src/main/assets/mimocook.txt || { echo "Decoded MiMo cookie is empty"; exit 1; }
          grep -q "xiaomichatbot_ph" app/src/main/assets/mimocook.txt || { echo "Decoded MiMo cookie has no xiaomichatbot_ph key"; exit 1; }
          if echo "80f3e604347183626b009d27d263dfe714fa5e902c3f92482deda3e99962f8ff  app/src/main/assets/mimocook.txt" | sha256sum -c - >/dev/null 2>&1; then echo "MiMo cookie is still the placeholder"; exit 1; fi

      - name: Build release APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/cl0de.keystore
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: cl0de
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cl0de-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
