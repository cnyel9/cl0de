# Release on tag: v0.0.1-beta-3 → build the APK, sign it with the same key as earlier versions, publish to Releases.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.0.1-beta-3"
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Signing key from a secret: without the same key the update will not install over the existing app.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "SIGNING_KEYSTORE_B64 secret is missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cl0de.keystore"

      # MiMo session cookie from a secret, decoded over the placeholder asset
      # so it ships inside the APK (every install can use MiMo with no login).
      # This second build path needs the same step and the same fail-closed
      # guard as build-cl0de.yml, or a tag release would silently ship the
      # placeholder. The checks only test existence, a key NAME and a hash.
      - name: MiMo cookie
        env:
          MIMO_COOKIE_B64: ${{ secrets.MIMO_COOKIE_B64 }}
        run: |
          test -n "$MIMO_COOKIE_B64" || { echo "MIMO_COOKIE_B64 secret is missing"; exit 1; }
          echo "$MIMO_COOKIE_B64" | base64 -d > app/src/main/assets/mimocook.txt
          test -s app/src/main/assets/mimocook.txt || { echo "Decoded MiMo cookie is empty"; exit 1; }
          grep -q "xiaomichatbot_ph" app/src/main/assets/mimocook.txt || { echo "Decoded MiMo cookie has no xiaomichatbot_ph key"; exit 1; }
          if echo "80f3e604347183626b009d27d263dfe714fa5e902c3f92482deda3e99962f8ff  app/src/main/assets/mimocook.txt" | sha256sum -c - >/dev/null 2>&1; then echo "MiMo cookie is still the placeholder"; exit 1; fi

      - name: Build
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/cl0de.keystore
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: cl0de
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="cl0de-$TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          NOTES="docs/releases/$TAG.md"
          [ -f "$NOTES" ] || echo "Cl0de $TAG" > "$NOTES"
          PRE=""; case "$TAG" in *alpha*|*beta*|*rc*) PRE="--prerelease";; esac
          NAME="${TAG/-beta-/ beta-}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" $PRE --title "$NAME" --notes-file "$NOTES"
          fi
